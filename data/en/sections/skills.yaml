  url: "https://docs.python.org/3/"

- name: SQL
  logo: /images/sections/skills/SQL.png
  summary: "Advanced querying with CTEs, window functions, subqueries and data transformations. Experience with data validation, joins, aggregations and analytical querying for business and operational use cases."
