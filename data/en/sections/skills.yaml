  logo: /images/sections/skills/python.png
  summary: "Design of automated processing workflows for data cleaning, transformation, tabulation and report generation, with focus on reproducibility, quality and operational efficiency."
  categories: ["all", "data-engineering"]

- name: Cloud & Data Platforms
  logo: /images/sections/skills/cloud.png
  summary: "Familiarity with AWS and GCP data services, including BigQuery, Redshift, Athena, Glue and related cloud-based analytics and storage concepts."
  categories: ["all", "cloud-platform"]

- name: Linux / Shell
  logo: /images/sections/skills/linux.png
