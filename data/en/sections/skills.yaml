- name: Power BI
  logo: /images/sections/skills/power-bi.png
  summary: "Interactive dashboards, data modeling, DAX and Power Query for business reporting and decision support. Experience building analytical views, KPIs and visual storytelling."
  categories: ["all", "analytics-bi"]

- name: Excel
  logo: /images/sections/skills/excel.png
  summary: "Advanced Excel for analysis, reporting and process support, including formulas, validation, data organization and management reporting."
  categories: ["all", "analytics-bi"]
  url: "https://www.microsoft.com/microsoft-365/excel"

- name: Statistical Analysis
  logo: /images/sections/skills/stats.png
  summary: "Descriptive and inferential analysis applied to market research and healthcare studies, including significance testing such as Z-test, t-test, ANOVA, Tukey and Bonferroni, as well as methodologies like NPS and Gabor-Granger."
