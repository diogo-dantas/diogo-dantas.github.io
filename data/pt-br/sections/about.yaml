# a summary about you
summary: >-
  Profissional de dados com experiência em pesquisas de mercado no setor de saúde, análise estatística e automação de processos. Utilizo Python, SQL, SPSS, Excel e Power BI para limpar, validar, transformar e analisar bases de dados, aplicar métodos estatísticos e construir fluxos automatizados de processamento. Minha trajetória também inclui análises financeiras e operacionais, otimização de custos e decisões orientadas por dados. Atualmente, aprofundo meus conhecimentos em Machine Learning Engineering e MLOps, com foco em pipelines reprodutíveis, implantação de modelos e sistemas confiáveis em produção.


