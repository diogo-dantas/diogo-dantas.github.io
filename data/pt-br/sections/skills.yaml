skills:
- name: Python
  logo: /images/sections/skills/python.png
  summary: "Processamento de dados, automação e fluxos analíticos com Pandas, NumPy, requests e Jupyter. Experiência com scripts, rotinas de ETL, web scraping e bibliotecas de apoio ao desenvolvimento, como pytest e Django."
  categories: ["todos", "programacao", "engenharia-dados"]
  url: "https://docs.python.org/3/"

- name: SQL
  logo: /images/sections/skills/SQL.png
  summary: "Consultas avançadas com CTEs, window functions, subqueries e transformações de dados. Experiência com validação, joins, agregações e consultas analíticas para contextos de negócio e operação."
  categories: ["todos", "programacao", "engenharia-dados", "analytics-bi"]

- name: Power BI
  logo: /images/sections/skills/power-bi.png
  summary: "Dashboards interativos, modelagem de dados, DAX e Power Query para reporting e apoio à decisão. Experiência na construção de visões analíticas, KPIs e storytelling visual."
  categories: ["todos", "analytics-bi"]

- name: Excel
  logo: /images/sections/skills/excel.png
  summary: "Excel avançado para análise, reporting e suporte a processos, incluindo fórmulas, validação, organização de bases e relatórios gerenciais."
  categories: ["todos", "analytics-bi"]
  url: "https://www.microsoft.com/pt-br/microsoft-365/excel"

- name: Análise Estatística
  logo: /images/sections/skills/stats.png
  summary: "Análises descritivas e inferenciais aplicadas a pesquisas de mercado e estudos na área da saúde, incluindo testes de significância como Z, t-Student, ANOVA, Tukey e Bonferroni, além de metodologias como NPS e Gabor-Granger."
  categories: ["todos", "estatistica"]

- name: SPSS
  logo: /images/sections/skills/spss.png
  summary: "Experiência com processamento e tabulação de dados de pesquisa, incluindo transformações, agregações, cruzamentos e geração de saídas estatísticas para entregas analíticas."
  categories: ["todos", "estatistica", "analytics-bi"]

- name: Git & GitHub
  logo: /images/sections/skills/git.png
  summary: "Controle de versão para portfólio e projetos de desenvolvimento, incluindo gerenciamento de repositórios, commits, branches e fluxos de publicação no GitHub."
  categories: ["todos", "cloud-plataforma"]
  url: "https://git-scm.com/"

- name: Pipelines de Dados & Automação
  logo: /images/sections/skills/python.png
  summary: "Desenho de fluxos automatizados para limpeza, transformação, tabulação e geração de relatórios, com foco em reprodutibilidade, qualidade e eficiência operacional."
  categories: ["todos", "engenharia-dados"]

- name: Cloud & Plataformas de Dados
  logo: /images/sections/skills/cloud.png
  summary: "Familiaridade com serviços de dados em AWS e GCP, incluindo BigQuery, Redshift, Athena, Glue e conceitos relacionados a analytics e armazenamento em nuvem."
  categories: ["todos", "cloud-plataforma"]

- name: Linux / Shell
  logo: /images/sections/skills/linux.png
  summary: "Uso básico a intermediário de ambientes Linux e shell scripting para automação de tarefas, manipulação de arquivos e execução de fluxos de trabalho."
  categories: ["todos", "cloud-plataforma", "engenharia-dados"]
